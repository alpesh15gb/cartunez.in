services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartunez_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartunez_ci"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ci-meilisearch-master-key
    ports:
      - "127.0.0.1:7700:7700"
